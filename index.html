<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我们的开销</title>
<meta name="theme-color" content="#F1F0EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="开销">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icons/kaixiao-touch-180.png?v=3">
<link rel="icon" type="image/png" href="icons/kaixiao-192.png?v=3">
<style>
  html,body{ margin:0; height:100%; background:#F1F0EC; overflow:hidden; }
  /* The app lives in this frame. Insets keep it clear of the notch and the
     home-indicator area when launched from the home screen. */
  #app{ position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; bottom:0;
        width:100%; height:calc(100% - env(safe-area-inset-top,0px)); border:0; background:#F1F0EC; }
  #boot{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
         font-family:Georgia,'Songti SC',serif; color:#C8902F; font-size:28px; font-weight:700; letter-spacing:.06em; }
  #boot small{ margin-top:14px; font:12px ui-monospace,Menlo,monospace; color:#8C8B86; letter-spacing:.04em; }
</style>
</head>
<body>
<div id="boot">我们的开销<small id="bootmsg">正在打开 Opening…</small></div>
<iframe id="app" title="我们的开销" allow="clipboard-write"></iframe>
<script>
  /* ===== Paste your Apps Script web-app URL here (the one ending in /exec) ===== */
  const APP_URL = 'PASTE_YOUR_EXEC_URL_HERE';
  /* ============================================================================ */

  const frame = document.getElementById('app');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(APP_URL)) {
    document.getElementById('bootmsg').textContent = 'Set APP_URL in index.html to your /exec link.';
    frame.remove();
  } else {
    frame.src = APP_URL + (APP_URL.includes('?') ? '&' : '?') + 'v=2';
    frame.addEventListener('load', () => { const b = document.getElementById('boot'); if (b) b.remove(); });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
